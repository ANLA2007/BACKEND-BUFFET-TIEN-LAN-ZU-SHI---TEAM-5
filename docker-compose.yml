services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: buffet_tien_lan_zu_shi_api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=${DB_SERVER:-host.docker.internal},${DB_PORT:-1433};Database=${DB_NAME:-buffet};User Id=${DB_USER:-Sa};Password=${DB_PASSWORD:-Cambiar_Esta_Clave_123!};TrustServerCertificate=True;
      - JwtSettings__SecretKey=${JWT_SECRET:-78WYvsH7iNnqgvqA5mgPGiJ0Q7pB097czFXT8OU5}
      - JwtSettings__Issuer=${JWT_ISSUER:-https://api.tienlanzushi.com}
      - JwtSettings__Audiencie=${JWT_AUDIENCE:-https://tienlanzushi.com}
      - MongoLogSettings__ConnectionString=mongodb://mongodb-logs:27017   
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:                                                            
      - mongodb-logs

  mongodb-logs:                                                            
    image: mongo:latest
    container_name: srv_mongodb_logs
    restart: always
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_DATABASE: SystemLogsDb
    volumes:
      - mongo_logs_volume:/data/db

  mongo-express:                                                         
    image: mongo-express:latest
    container_name: srv_mongo_express_ui
    restart: always
    ports:
      - "8082:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb-logs
      ME_CONFIG_MONGODB_PORT: 27017
    depends_on:
      - mongodb-logs

volumes:
  mongo_logs_volume: